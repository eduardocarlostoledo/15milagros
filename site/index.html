<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mis XV · Milagros</title>
  <meta name="description" content="Baile de máscaras · Sábado 7 de noviembre, 21:00 hs · Club UPCN, Candelaria.">
  <meta name="theme-color" content="#000000">
  <meta http-equiv="content-language" content="es-AR">
  <meta name="geo.region" content="AR-N">
  <meta name="geo.placename" content="Posadas, Misiones, Argentina">
  <meta name="geo.position" content="-27.3671;-55.8961">
  <meta name="ICBM" content="-27.3671, -55.8961">
  <meta property="og:locale" content="es_AR">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mis XV · Milagros">
  <meta property="og:description" content="Tienes una invitación. Sábado 7 de noviembre, 21:00 hs.">
  <!-- Absolute URL required by WhatsApp/Facebook: must match the Netlify site name -->
  <meta property="og:url" content="https://xv-milagros.netlify.app/">
  <meta property="og:image" content="https://xv-milagros.netlify.app/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Milagros · Mis XV">

  <link rel="icon" type="image/webp" href="assets/logo.webp">
  <link rel="preload" as="image" href="assets/fondo-top.webp">
  <link rel="preload" as="image" href="assets/sobre-cerrado.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arapey&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --gold: #c4a687;
      --gold-light: #fff8cd;
      --screen-max: 460px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--gold);
      font-family: "Arapey", Georgia, serif;
      -webkit-tap-highlight-color: transparent;
    }

    body { overflow-x: hidden; }
    body.is-locked { overflow: hidden; height: 100dvh; }

    img { display: block; max-width: none; user-select: none; -webkit-user-drag: none; }

    button, a { font: inherit; color: inherit; }

    :focus-visible { outline: 2px solid var(--gold-light); outline-offset: 4px; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }

    /* Each screen reproduces a 360x720 Canva page. Children are placed with
       Canva coordinates via --t (top), --l (left), --w (width). */
    .screen {
      position: relative;
      width: min(100%, var(--screen-max));
      aspect-ratio: 1 / 2;
      margin: 0 auto;
      overflow: hidden;
      container-type: inline-size;
      background: var(--bg);
    }

    .el {
      position: absolute;
      top: calc(var(--t) / 720 * 100%);
      left: calc(var(--l) / 360 * 100%);
      width: calc(var(--w) / 360 * 100%);
      height: auto;
    }

    .el > img { width: 100%; height: auto; }

    .tap {
      appearance: none;
      border: 0;
      padding: 0;
      background: none;
      cursor: pointer;
    }

    [hidden] { display: none !important; }

    /* ---------- Cover ---------- */
    .cover { height: 100dvh; max-height: calc(min(100vw, var(--screen-max)) * 2); }

    .envelope-closed { animation: float 4s ease-in-out infinite; }
    .envelope-closed img { filter: drop-shadow(0 18px 22px rgba(0, 0, 0, .8)); }

    .envelope-closed::after {
      /* Gold glow pulsing over the wax seal */
      content: "";
      position: absolute;
      left: 50%;
      top: 51%;
      width: 34%;
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 0 rgba(196, 166, 135, .55);
      animation: pulse 2.2s ease-out infinite;
      pointer-events: none;
    }

    /* Step 1 -> 2: the float pauses in place, the envelope dissolves into light */
    .is-breaking .envelope-closed { animation-play-state: paused; cursor: default; }
    .is-breaking .envelope-closed img { animation: dissolve .95s cubic-bezier(.65, 0, .35, 1) forwards; }
    .is-breaking .envelope-closed::after { animation: seal-burst .95s ease-out forwards; }
    .is-breaking .hint,
    .is-breaking .music { transition: opacity .5s ease; opacity: 0; }
    .is-breaking .flash { animation: flash 1.1s ease-in-out forwards; }

    .flash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 51%, rgba(255, 248, 205, .55), rgba(196, 166, 135, .18) 30%, transparent 60%);
      opacity: 0;
      pointer-events: none;
    }

    /* Frosted-glass veil with a drifting gold gradient that covers the screen swap */
    .veil {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(60% 40% at 30% 35%, rgba(196, 166, 135, .28), transparent 70%),
        radial-gradient(50% 35% at 70% 65%, rgba(255, 248, 205, .18), transparent 70%),
        linear-gradient(160deg, rgba(20, 16, 12, .35), rgba(0, 0, 0, .55));
      background-size: 200% 200%, 200% 200%, 100% 100%;
      -webkit-backdrop-filter: blur(0) saturate(1);
      backdrop-filter: blur(0) saturate(1);
      transition: opacity .8s cubic-bezier(.4, 0, .2, 1),
                  backdrop-filter .8s cubic-bezier(.4, 0, .2, 1),
                  -webkit-backdrop-filter .8s cubic-bezier(.4, 0, .2, 1);
    }

    .veil.is-on {
      opacity: 1;
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      backdrop-filter: blur(18px) saturate(1.4);
      animation: veil-drift 2.4s ease-in-out infinite alternate;
    }

    .hint { animation: blink 2.4s ease-in-out infinite; }

    /* Music button with curved "Dale Play" label */
    .music {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(0, 0, 0, .55);
      border: 1px solid rgba(196, 166, 135, .55);
    }

    .music svg.icon { width: 42%; height: 42%; fill: var(--gold); }
    .music .pause { display: none; }
    .music[aria-pressed="true"] .play { display: none; }
    .music[aria-pressed="true"] .pause { display: block; }
    .music[aria-pressed="true"] { animation: spin-glow 3s linear infinite; }

    .music-label {
      position: absolute;
      left: -30%;
      top: -58%;
      width: 160%;
      overflow: visible;
      pointer-events: none;
      font-family: "Arapey", serif;
      letter-spacing: .04em;
      fill: var(--gold);
    }

    /* ---------- Letter ---------- */
    .envelope-open { transition: transform .6s ease; }
    .envelope-open img { filter: drop-shadow(0 18px 22px rgba(0, 0, 0, .8)); }
    .is-entering .envelope-open img { animation: materialize 1.2s cubic-bezier(.22, 1, .36, 1) both; }
    .is-entering .read-hint { animation: fade-up .9s ease .55s both, blink 2.4s ease-in-out 1.5s infinite; }
    .is-read .envelope-open { transform: translateY(-4%); cursor: default; }

    .letter-text {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 1.2s ease .2s, transform 1.2s ease .2s;
    }
    .is-read .letter-text { opacity: 1; transform: none; }
    .is-read .read-hint { display: none; }

    .scroll-cue {
      position: absolute;
      left: 50%;
      bottom: 2.5%;
      transform: translateX(-50%);
      width: 7%;
      opacity: 0;
      transition: opacity .8s ease 1.4s;
      animation: bob 1.8s ease-in-out infinite;
    }
    .is-read .scroll-cue { opacity: .8; }
    .scroll-cue svg { width: 100%; stroke: var(--gold); fill: none; stroke-width: 2; }

    /* ---------- Countdown ---------- */
    .countdown { aspect-ratio: 310 / 92; }
    .countdown > img { position: absolute; inset: 0; }

    .count-value {
      position: absolute;
      top: 52%;
      transform: translate(-50%, -50%);
      font-family: "Cormorant Garamond", "Times New Roman", serif;
      font-weight: 600;
      font-size: calc(26 * 100cqw / 360);
      line-height: 1;
      color: var(--gold-light);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 10px rgba(196, 166, 135, .35);
    }

    .countdown-done {
      position: absolute;
      inset: 28% 0 auto;
      text-align: center;
      font-size: calc(20 * 100cqw / 360);
      color: var(--gold-light);
    }

    /* Icon nav: three equal hit areas over the icons image */
    .icon-nav { display: grid; grid-template-columns: repeat(3, 1fr); }
    .icon-nav > img { position: absolute; inset: 0; width: 100%; pointer-events: none; }
    .icon-nav a { aspect-ratio: 241 / 187; }

    .fade-edges {
      -webkit-mask-image: radial-gradient(ellipse 60% 55% at 50% 50%, #000 60%, transparent 100%);
      mask-image: radial-gradient(ellipse 60% 55% at 50% 50%, #000 60%, transparent 100%);
    }

    /* ---------- Info ---------- */
    .link-card { display: block; transition: transform .25s ease, filter .25s ease; }
    .link-card:active { transform: scale(.96); }
    @media (hover: hover) {
      .link-card:hover { transform: translateY(-2px); filter: brightness(1.15); }
    }

    .footer {
      padding: 1.5rem 1rem 2.5rem;
      text-align: center;
      font-size: .8rem;
      letter-spacing: .12em;
      color: rgba(196, 166, 135, .6);
    }

    /* ---------- Reveal on scroll ---------- */
    .reveal { opacity: 0; transform: translateY(18px); transition: opacity 1.1s ease, transform 1.1s ease; }
    .reveal.is-in { opacity: 1; transform: none; }

    /* ---------- Sparkles ---------- */
    .sparkles { position: absolute; inset: 0; pointer-events: none; }
    .sparkles i {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--gold-light);
      box-shadow: 0 0 6px 1px rgba(255, 248, 205, .8);
      opacity: 0;
      animation: twinkle 3.6s ease-in-out infinite;
    }

    @keyframes float { 50% { transform: translateY(-2.5%); } }
    @keyframes pulse { 70%, 100% { box-shadow: 0 0 0 18px rgba(196, 166, 135, 0); } }
    @keyframes blink { 50% { opacity: .55; } }
    @keyframes bob { 50% { transform: translate(-50%, 30%); } }
    @keyframes twinkle { 20%, 60% { opacity: .9; } 80% { opacity: 0; } }
    @keyframes spin-glow { 50% { box-shadow: 0 0 14px rgba(196, 166, 135, .6); } }
    @keyframes dissolve {
      0% { transform: none; filter: drop-shadow(0 18px 22px rgba(0, 0, 0, .8)) blur(0) brightness(1); opacity: 1; }
      35% { transform: translateY(-2%) scale(1.03); filter: drop-shadow(0 0 18px rgba(196, 166, 135, .55)) blur(0) brightness(1.25); }
      100% { transform: translateY(-4%) scale(1.08); filter: drop-shadow(0 0 30px rgba(196, 166, 135, 0)) blur(10px) brightness(1.6); opacity: 0; }
    }
    @keyframes seal-burst {
      0% { box-shadow: 0 0 0 0 rgba(255, 248, 205, .7); opacity: 1; }
      100% { box-shadow: 0 0 60px 60px rgba(196, 166, 135, 0); opacity: 0; }
    }
    @keyframes flash { 45% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes veil-drift {
      from { background-position: 0% 0%, 100% 100%, 0 0; }
      to { background-position: 100% 60%, 0% 40%, 0 0; }
    }
    @keyframes materialize {
      from { opacity: 0; transform: translateY(5%) scale(.92); filter: drop-shadow(0 0 0 rgba(0, 0, 0, 0)) blur(10px); }
      to { opacity: 1; transform: none; filter: drop-shadow(0 18px 22px rgba(0, 0, 0, .8)) blur(0); }
    }
    @keyframes fade-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body class="is-locked">
  <main>
    <h1 class="sr-only">Mis XV · Milagros — Baile de máscaras</h1>

    <!-- 1. Cover: closed envelope -->
    <section id="cover" class="screen cover" aria-label="Portada">
      <img class="el" style="--t:0;--l:0;--w:421" src="assets/fondo-top.webp" alt="">

      <a class="scroll-cue" href="#event" aria-label="Ver más">

  </main>

  <div class="veil" aria-hidden="true"></div>

  <audio id="music" src="assets/musica.mp3" preload="metadata" loop></audio>

  <script>
    (() => {
      "use strict";

      const CONFIG = {
        // Official Argentina time: UTC-3 all year (no DST). Misiones -> America/Argentina/Cordoba
        timeZone: "America/Argentina/Cordoba",
        utcOffset: "-03:00",
        // Saturday 7 Nov 2026, 21:00 local time in Posadas, Misiones
        eventLocal: "2026-11-07T21:00:00",
        mapsUrl: "https://www.google.com/maps/search/?api=1&query=Club+UPCN+Candelaria",
        whatsappNumber: "5493764712966",
        whatsappText:
          "Querida Milagros: con enorme alegría confirmo mi presencia para acompañarte " +
          "en la noche de tus XV años, el sábado 7 de noviembre. Será un verdadero honor " +
          "ser parte de este momento tan especial y celebrar contigo el comienzo de este " +
          "nuevo capítulo. Nos vemos en el baile de máscaras. 🎭✨"
      };

      const $ = (sel) => document.querySelector(sel);
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      /* Links */
      $("#maps-link").href = CONFIG.mapsUrl;
      const rsvpUrl =
        `https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(CONFIG.whatsappText)}`;
      $("#rsvp-link").href = rsvpUrl;
      $("#nav-maps").href = CONFIG.mapsUrl;
      $("#nav-rsvp").href = rsvpUrl;

      /* Sparkles */
      document.querySelectorAll(".sparkles").forEach((box) => {
        for (let i = 0; i < 14; i++) {
          const s = document.createElement("i");
          s.style.left = `${Math.random() * 100}%`;
          s.style.top = `${Math.random() * 100}%`;
          s.style.animationDelay = `${Math.random() * 3.6}s`;
          box.appendChild(s);
        }
      });

      /* Music: button only appears if assets/musica.mp3 exists */
      const audio = $("#music");
      const musicBtn = $("#music-toggle");
      audio.volume = 0.64; // same level as the Canva design

      audio.addEventListener("loadedmetadata", () => { musicBtn.hidden = false; });

      const setPlaying = (playing) => {
        musicBtn.setAttribute("aria-pressed", String(playing));
        musicBtn.setAttribute("aria-label", playing ? "Pausar música" : "Reproducir música");
      };

      const playMusic = () => audio.play().then(() => setPlaying(true)).catch(() => {});

      musicBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (audio.paused) playMusic();
        else { audio.pause(); setPlaying(false); }
      });

      // Keep the button reachable after the cover is gone
      const moveMusicButton = () => {
        if (musicBtn.hidden) return;
        Object.assign(musicBtn.style, {
          position: "fixed", top: "auto", left: "auto", right: "14px", bottom: "14px",
          width: "46px", zIndex: "10"
        });
        musicBtn.querySelector(".music-label").style.display = "none";
        document.body.appendChild(musicBtn);
      };

      /* Step 1: break the seal */
      const cover = $("#cover");
      const letter = $("#letter");

      $("#open-envelope").addEventListener("click", () => {
        if (cover.classList.contains("is-breaking")) return;
        cover.classList.add("is-breaking");
        if (audio.readyState > 0) playMusic();

        const veil = $(".veil");
        const swapAt = reduceMotion ? 0 : 750;

        veil.classList.add("is-on");

        setTimeout(() => {
          moveMusicButton();
          cover.hidden = true;
          letter.classList.add("is-entering");
          letter.hidden = false;
          window.scrollTo(0, 0);
          $("#read-letter").focus({ preventScroll: true });

          // Let the new screen paint under the glass, then lift the veil
          requestAnimationFrame(() => requestAnimationFrame(() => veil.classList.remove("is-on")));
        }, swapAt);
      });

      /* Step 2: read the letter, unlock the rest */
      $("#read-letter").addEventListener("click", () => {
        if (letter.classList.contains("is-read")) return;
        letter.classList.add("is-read");
        document.querySelectorAll("#event, #info, #dress, #footer").forEach((s) => { s.hidden = false; });
        document.body.classList.remove("is-locked");
        startCountdown();
      });

      /* Reveal on scroll */
      const io = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-in");
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15 });
      document.querySelectorAll(".reveal").forEach((el) => io.observe(el));

      /* Countdown */
      const target = Date.parse(CONFIG.eventLocal + CONFIG.utcOffset);

      // Guard against a wrong device clock: use the server's Date header as reference
      let clockOffset = 0;
      const now = () => Date.now() + clockOffset;

      async function syncClock() {
        try {
          const sent = Date.now();
          const res = await fetch(location.pathname, { method: "HEAD", cache: "no-store" });
          const serverTime = Date.parse(res.headers.get("Date"));
          if (Number.isNaN(serverTime)) return;
          const received = Date.now();
          const offset = serverTime - (sent + received) / 2;
          // Date header has 1s resolution: ignore sub-2s differences
          if (Math.abs(offset) > 2000) clockOffset = offset;
        } catch {
          // Offline or blocked: keep device clock
        }
      }
      const units = {
        days: $('[data-unit="days"]'),
        hours: $('[data-unit="hours"]'),
        minutes: $('[data-unit="minutes"]'),
        seconds: $('[data-unit="seconds"]')
      };
      let timer;

      function tick() {
        const diff = target - now();
        if (diff <= 0) {
          clearInterval(timer);
          Object.values(units).forEach((u) => { u.hidden = true; });
          $(".countdown-done").hidden = false;
          return;
        }
        const s = Math.floor(diff / 1000);
        units.days.textContent = Math.floor(s / 86400);
        units.hours.textContent = String(Math.floor((s % 86400) / 3600)).padStart(2, "0");
        units.minutes.textContent = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
        units.seconds.textContent = String(s % 60).padStart(2, "0");
      }

      function startCountdown() {
        if (timer) return;
        tick();
        timer = setInterval(tick, 1000);
      }

      syncClock().then(() => { if (timer) tick(); });
    })();
  </script>
</body>
</html>
